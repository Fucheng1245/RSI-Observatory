<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050814"/><stop offset="1" stop-color="#0b1530"/></linearGradient>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="900" rx="28" fill="url(#bg)"/>
<g opacity=".11" stroke="#93c5fd"><path d="M0 130H1600M0 260H1600M0 390H1600M0 520H1600M0 650H1600M0 780H1600"/><path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/></g>
<text x="72" y="92" fill="#f8fafc" font-size="54" font-family="Inter,Segoe UI,sans-serif" font-weight="800">RSI Observatory Framework</text>
<text x="72" y="137" fill="#9fb0c8" font-size="24" font-family="Inter,Segoe UI,sans-serif">Three orthogonal axes: what changes · how recursive · how strong is the evidence</text>

<!-- Axis A -->
<g transform="translate(72,205)">
<rect width="1456" height="185" rx="24" fill="#0b1222" stroke="#24334b"/>
<text x="30" y="48" fill="#67e8f9" font-size="23" font-family="Inter,Segoe UI,sans-serif" font-weight="800">AXIS A · WHAT CHANGES?</text>
<text x="30" y="80" fill="#9fb0c8" font-size="18" font-family="Inter,Segoe UI,sans-serif">Improvement scope — adapted from current self-improving-agent frameworks</text>
<rect x="30" y="105" width="205" height="55" rx="15" fill="#101b30" stroke="#355078"/><text x="48" y="129" fill="#eaf4ff" font-size="17" font-family="Inter,Segoe UI,sans-serif" font-weight="800">MODEL</text><text x="48" y="149" fill="#89a1bf" font-size="13" font-family="Inter,Segoe UI,sans-serif">weights · policy</text><rect x="253" y="105" width="270" height="55" rx="15" fill="#101b30" stroke="#355078"/><text x="271" y="129" fill="#eaf4ff" font-size="17" font-family="Inter,Segoe UI,sans-serif" font-weight="800">HARNESS</text><text x="271" y="149" fill="#89a1bf" font-size="13" font-family="Inter,Segoe UI,sans-serif">prompts · workflow · tools · code</text><rect x="541" y="105" width="245" height="55" rx="15" fill="#101b30" stroke="#355078"/><text x="559" y="129" fill="#eaf4ff" font-size="17" font-family="Inter,Segoe UI,sans-serif" font-weight="800">DATA SYSTEM</text><text x="559" y="149" fill="#89a1bf" font-size="13" font-family="Inter,Segoe UI,sans-serif">memory · tasks · experience</text><rect x="804" y="105" width="225" height="55" rx="15" fill="#101b30" stroke="#355078"/><text x="822" y="129" fill="#eaf4ff" font-size="17" font-family="Inter,Segoe UI,sans-serif" font-weight="800">TRAINER</text><text x="822" y="149" fill="#89a1bf" font-size="13" font-family="Inter,Segoe UI,sans-serif">training · reward · evaluator</text><rect x="1047" y="105" width="390" height="55" rx="15" fill="#101b30" stroke="#355078"/><text x="1065" y="129" fill="#eaf4ff" font-size="17" font-family="Inter,Segoe UI,sans-serif" font-weight="800">IMPROVEMENT MECHANISM</text><text x="1065" y="149" fill="#89a1bf" font-size="13" font-family="Inter,Segoe UI,sans-serif">diagnose · propose · select · integrate</text></g>

<!-- Axis B -->
<g transform="translate(72,420)">
<rect width="1456" height="205" rx="24" fill="#0b1222" stroke="#24334b"/>
<text x="30" y="48" fill="#c4b5fd" font-size="23" font-family="Inter,Segoe UI,sans-serif" font-weight="800">AXIS B · HOW RECURSIVE?</text>
<text x="30" y="80" fill="#9fb0c8" font-size="18" font-family="Inter,Segoe UI,sans-serif">L1–L5 capability depth. L4 begins when the improvement mechanism itself is modifiable.</text>
<path d="M65 145 H1380" stroke="url(#g)" stroke-width="5" filter="url(#glow)"/>
<circle cx="90" cy="145" r="18" fill="#07101e" stroke="#60a5fa" stroke-width="4"/><text x="71" y="123" fill="#fff" font-size="16" font-family="Inter,Segoe UI,sans-serif" font-weight="800">L1</text><text x="35" y="180" fill="#e8eff9" font-size="16" font-family="Inter,Segoe UI,sans-serif" font-weight="800">Manual</text><text x="5" y="199" fill="#8093ad" font-size="12" font-family="Inter,Segoe UI,sans-serif">Human applies changes</text><circle cx="355" cy="145" r="18" fill="#07101e" stroke="#60a5fa" stroke-width="4"/><text x="336" y="123" fill="#fff" font-size="16" font-family="Inter,Segoe UI,sans-serif" font-weight="800">L2</text><text x="300" y="180" fill="#e8eff9" font-size="16" font-family="Inter,Segoe UI,sans-serif" font-weight="800">Assisted</text><text x="270" y="199" fill="#8093ad" font-size="12" font-family="Inter,Segoe UI,sans-serif">AI proposes; human closes loop</text><circle cx="625" cy="145" r="18" fill="#07101e" stroke="#60a5fa" stroke-width="4"/><text x="606" y="123" fill="#fff" font-size="16" font-family="Inter,Segoe UI,sans-serif" font-weight="800">L3</text><text x="570" y="180" fill="#e8eff9" font-size="16" font-family="Inter,Segoe UI,sans-serif" font-weight="800">Programmatic</text><text x="540" y="199" fill="#8093ad" font-size="12" font-family="Inter,Segoe UI,sans-serif">AI proposes + applies + validates</text><circle cx="900" cy="145" r="18" fill="#07101e" stroke="#60a5fa" stroke-width="4"/><text x="881" y="123" fill="#fff" font-size="16" font-family="Inter,Segoe UI,sans-serif" font-weight="800">L4</text><text x="845" y="180" fill="#e8eff9" font-size="16" font-family="Inter,Segoe UI,sans-serif" font-weight="800">Bounded RSI</text><text x="815" y="199" fill="#8093ad" font-size="12" font-family="Inter,Segoe UI,sans-serif">Improvement mechanism can change</text><circle cx="1190" cy="145" r="18" fill="#07101e" stroke="#60a5fa" stroke-width="4"/><text x="1171" y="123" fill="#fff" font-size="16" font-family="Inter,Segoe UI,sans-serif" font-weight="800">L5</text><text x="1135" y="180" fill="#e8eff9" font-size="16" font-family="Inter,Segoe UI,sans-serif" font-weight="800">General RSI</text><text x="1105" y="199" fill="#8093ad" font-size="12" font-family="Inter,Segoe UI,sans-serif">L4 across broad evolving domains</text></g>

<!-- Axis C -->
<g transform="translate(72,655)">
<rect width="1456" height="170" rx="24" fill="#0b1222" stroke="#24334b"/>
<text x="30" y="45" fill="#7dd3fc" font-size="23" font-family="Inter,Segoe UI,sans-serif" font-weight="800">AXIS C · HOW STRONG IS THE EVIDENCE?</text>
<text x="30" y="76" fill="#9fb0c8" font-size="18" font-family="Inter,Segoe UI,sans-serif">Editorial evidence ladder — deliberately harder than project self-description</text>
<rect x="30" y="100" width="175" height="45" rx="13" fill="#0f1a2d" stroke="#334b70"/><text x="44" y="127" fill="#f8fafc" font-size="15" font-family="Inter,Segoe UI,sans-serif" font-weight="800">E0</text><text x="83" y="127" fill="#9fb0c8" font-size="14" font-family="Inter,Segoe UI,sans-serif">Claim</text><rect x="217" y="100" width="205" height="45" rx="13" fill="#0f1a2d" stroke="#334b70"/><text x="231" y="127" fill="#f8fafc" font-size="15" font-family="Inter,Segoe UI,sans-serif" font-weight="800">E1</text><text x="270" y="127" fill="#9fb0c8" font-size="14" font-family="Inter,Segoe UI,sans-serif">Public artifact</text><rect x="434" y="100" width="220" height="45" rx="13" fill="#0f1a2d" stroke="#334b70"/><text x="448" y="127" fill="#f8fafc" font-size="15" font-family="Inter,Segoe UI,sans-serif" font-weight="800">E2</text><text x="487" y="127" fill="#9fb0c8" font-size="14" font-family="Inter,Segoe UI,sans-serif">Executable eval</text><rect x="666" y="100" width="255" height="45" rx="13" fill="#0f1a2d" stroke="#334b70"/><text x="680" y="127" fill="#f8fafc" font-size="15" font-family="Inter,Segoe UI,sans-serif" font-weight="800">E3</text><text x="719" y="127" fill="#9fb0c8" font-size="14" font-family="Inter,Segoe UI,sans-serif">Held-out persistent gain</text><rect x="933" y="100" width="255" height="45" rx="13" fill="#0f1a2d" stroke="#334b70"/><text x="947" y="127" fill="#f8fafc" font-size="15" font-family="Inter,Segoe UI,sans-serif" font-weight="800">E4</text><text x="986" y="127" fill="#9fb0c8" font-size="14" font-family="Inter,Segoe UI,sans-serif">Bounded meta-improvement</text><rect x="1200" y="100" width="245" height="45" rx="13" fill="#0f1a2d" stroke="#334b70"/><text x="1214" y="127" fill="#f8fafc" font-size="15" font-family="Inter,Segoe UI,sans-serif" font-weight="800">E5</text><text x="1253" y="127" fill="#9fb0c8" font-size="14" font-family="Inter,Segoe UI,sans-serif">Independent replication</text></g>
<text x="1518" y="865" text-anchor="end" fill="#64748b" font-size="15" font-family="Inter,Segoe UI,sans-serif">Domains (coding, AI R&amp;D, robotics, personal agents…) are tags — not levels.</text>
</svg>