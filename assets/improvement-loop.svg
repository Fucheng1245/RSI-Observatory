ize="21" font-family="Inter,Segoe UI,sans-serif" font-weight="800">REPEAT</text><text x="455" y="329" text-anchor="middle" fill="#8297b4" font-size="14" font-family="Inter,Segoe UI,sans-serif">new tasks · new state</text><path d="M750 289 Q862 294 974 330" fill="none" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/><path d="M1100 370 Q1100 422 1100 505" fill="none" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/><path d="M995 635 Q915 642 835 680" fill="none" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/><path d="M665 680 Q592 642 520 635" fill="none" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/><path d="M400 520 Q400 432 400 375" fill="none" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/><path d="M520 250 Q592 217 665 215" fill="none" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/><rect x="120" y="390" width="250" height="110" rx="18" fill="#111a2d" stroke="#7c3aed" stroke-width="2"/><text x="245" y="426" text-anchor="middle" fill="#c4b5fd" font-size="18" font-family="Inter,Segoe UI,sans-serif" font-weight="800">META-LOOP</text><text x="245" y="458" text-anchor="middle" fill="#f8fafc" font-size="20" font-family="Inter,Segoe UI,sans-serif" font-weight="800">Improve the improver</text><text x="245" y="484" text-anchor="middle" fill="#8396b3" font-size="13" font-family="Inter,Segoe UI,sans-serif">diagnosis · search · evaluator · update policy</text><path d="M370 445 C470 445 505 445 620 445" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
