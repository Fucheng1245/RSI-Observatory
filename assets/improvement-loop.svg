<text x="750" y="423" text-anchor="middle" fill="#f8fafc" font-size="26" font-family="Inter,Segoe UI,sans-serif" font-weight="800">Persistent,</text><text x="750" y="457" text-anchor="middle" fill="#f8fafc" font-size="26" font-family="Inter,Segoe UI,sans-serif" font-weight="800">verifiable</text><text x="750" y="491" text-anchor="middle" fill="#93c5fd" font-size="26" font-family="Inter,Segoe UI,sans-serif" font-weight="800">improvement</text>
