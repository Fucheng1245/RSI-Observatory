<text x="70" y="86" fill="#f8fafc" font-size="48" font-family="Inter,Segoe UI,sans-serif" font-weight="800">The Improvement Loop</text>
<text x="70" y="126" fill="#9fb0c8" font-size="22" font-family="Inter,Segoe UI,sans-serif">Persistent self-improvement is a loop. Recursive self-improvement starts when the loop itself becomes editable.</text>
