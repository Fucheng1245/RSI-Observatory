<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650"><defs><linearGradient id="ebg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050814"/><stop offset="1" stop-color="#10162c"/></linearGradient><linearGradient id="eg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect width="1500" height="650" rx="28" fill="url(#ebg)"/><text x="68" y="84" fill="#f8fafc" font-size="48" font-family="Inter,Segoe UI,sans-serif" font-weight="800">RSI Evidence Ladder</text><text x="68" y="125" fill="#9fb0c8" font-size="22" font-family="Inter,Segoe UI,sans-serif">A recursive claim should become harder to earn as the evidence burden increases.</text><rect x="68" y="455" width="210" height="105" rx="18" fill="#0f1a2d" stroke="#365077"/><text x="86" y="485" fill="#67e8f9" font-size="18" font-family="Inter,Segoe UI,sans-serif" font-weight="800">E0</text><text x="86" y="513" fill="#f8fafc" font-size="15" font-family="Inter,Segoe UI,sans-serif" font-weight="800">CLAIM</text><text x="86" y="539" fill="#8fa3bd" font-size="13" font-family="Inter,Segoe UI,sans-serif">self-description</text><rect x="304" y="403" width="210" height="157" rx="18" fill="#0f1a2d" stroke="#365077"/><text x="322" y="433" fill="#67e8f9" font-size="18" font-family="Inter,Segoe UI,sans-serif" font-weight="800">E1</text><text x="322" y="461" fill="#f8fafc" font-size="15" font-family="Inter,Segoe UI,sans-serif" font-weight="800">ARTIFACT</text><text x="322" y="487" fill="#8fa3bd" font-size="13" font-family="Inter,Segoe UI,sans-serif">public code / traces</text><rect x="540" y="351" width="210" height="209" rx="18" fill="#0f1a2d" stroke="#365077"/><text x="558" y="381" fill="#67e8f9" font-size="18" font-family="Inter,Segoe UI,sans-serif" font-weight="800">E2</text><text x="558" y="409" fill="#f8fafc" font-size="15" font-family="Inter,Segoe UI,sans-serif" font-weight="800">EXECUTABLE</text><text x="558" y="435" fill="#8